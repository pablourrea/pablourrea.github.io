<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }
        
        .prize-display {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90%;
            font-weight: bold;
            color: #333;
            font-size: 18px;
        }
        
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 8px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        
        .wheel-section {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: bottom right;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .wheel-section-content {
            transform: rotate(45deg);
            text-align: center;
            width: 100px;
            margin-left: -50px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        
        .center-circle {
            position: absolute;
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        
        .center-text {
            text-align: center;
            font-weight: bold;
            color: #333;
            padding: 5px;
        }
        
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: #ff4757;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 20;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        
        .spin-button {
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            border: none;
            border-radius: 50px;
            color: #333;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            width: 200px;
            height: 60px;
        }
        
        .spin-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        
        .spin-button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="prize-display" id="prizeDisplay">
            ¡Haz clic en Girar para empezar!
        </div>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <!-- Wheel sections will be generated by JavaScript -->
            </div>
            <div class="center-circle">
                <div class="center-text"></div>
            </div>
        </div>
        
        <button class="spin-button" id="spinButton">Girar</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const wheel = document.getElementById('wheel');
            const spinButton = document.getElementById('spinButton');
            const prizeDisplay = document.getElementById('prizeDisplay');
            
            // Create 5 colored sections for the wheel
            const colors = [
                '#FF5252', '#FF4081', '#E040FB', '#7C4DFF', '#536DFE'
            ];
            
            // Create wheel sections
            colors.forEach((color, index) => {
                const section = document.createElement('div');
                section.className = 'wheel-section';
                section.style.transform = `rotate(${index * 72}deg)`;
                section.style.backgroundColor = color;
                
                const content = document.createElement('div');
                content.className = 'wheel-section-content';
                content.textContent = '';
                
                section.appendChild(content);
                wheel.appendChild(section);
            });
            
            let spinCount = 0;
            const prizes = [
                "Cenar esta noche en el FresCo",
                "Otra vez vamos a ir a cenar al FresCo (No se duplica)",
                "¿Qué pasa, no te apetece cenar en el FresCo?"
            ];
            
            spinButton.addEventListener('click', function() {
                // Disable button during spin
                spinButton.disabled = true;
                
                // Clear prize display when spinning
                prizeDisplay.textContent = "";
                
                // Calculate rotation (multiple full rotations + final position)
                const extraRotation = 1080; // 3 full rotations
                const sectionAngle = 72; // 360/5 degrees per section
                
                // Determine the winning section based on spin count
                let winningSection;
                if (spinCount === 0) {
                    winningSection = 0; // First prize
                } else if (spinCount === 1) {
                    winningSection = 1; // Second prize
                } else {
                    winningSection = 2; // Third and subsequent prizes
                }
                
                // Calculate final rotation to land on the winning section
                const finalRotation = extraRotation + (360 - (winningSection * sectionAngle));
                
                // Apply rotation with CSS transition
                wheel.style.transform = `rotate(${finalRotation}deg)`;
                
                // Update button text after first spin
                if (spinCount === 0) {
                    spinButton.textContent = "Volver a girar por curiosidad";
                }
                
                // Show prize after animation completes
                setTimeout(() => {
                    let prize;
                    if (spinCount < prizes.length) {
                        prize = prizes[spinCount];
                    } else {
                        prize = prizes[prizes.length - 1]; // Last prize for all subsequent spins
                    }
                    
                    // Display the prize message
                    prizeDisplay.textContent = prize;
                    spinButton.disabled = false;
                    spinCount++;
                }, 4000);
            });
        });
    </script>
</body>
</html>
